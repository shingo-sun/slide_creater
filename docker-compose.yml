version: '3.8'

services:
  backend:
    build: ./backend
    container_name: slide_creater_backend
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    volumes:
      - ./backend/outputs:/app/outputs
      - ./backend/uploads:/app/uploads
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: slide_creater_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
