services:
  # バックエンドAPI
  - type: web
    name: slide-creater-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: "3.11"
    disk:
      name: data
      mountPath: /app/outputs
      sizeGB: 1
    rootDir: backend

  # フロントエンド
  - type: web
    name: slide-creater-web
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=3600
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: slide-creater-api
          property: host
    rootDir: frontend
